<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Water Kids - Cờ vua</title>

<style>
body{
    font-family:Arial, sans-serif;
    margin:0;
    background:#f4f6f9;
    text-align:center;
}

.header{
    background:#1976d2;
    color:white;
    padding:40px 20px;
}

.header h1{
    margin:0;
    font-size:42px;
}

.header p{
    font-size:20px;
    margin-top:12px;
}

.card{
    background:white;
    max-width:760px;
    margin:45px auto;
    padding:35px;
    border-radius:18px;
    box-shadow:0 0 18px rgba(0,0,0,0.15);
}

.button{
    display:block;
    margin:20px auto;
    padding:20px;
    color:white;
    text-decoration:none;
    border-radius:12px;
    font-size:22px;
    font-weight:bold;
    width:82%;
    transition:0.2s;
}

.green{
    background:#43a047;
}

.green:hover{
    background:#2e7d32;
}

.blue{
    background:#1976d2;
}

.blue:hover{
    background:#0d47a1;
}

.purple{
    background:#5e35b1;
}

.purple:hover{
    background:#4527a0;
}

.footer{
    color:#555;
    margin-top:30px;
    font-size:16px;
}

.note{
    color:#666;
    font-size:15px;
    margin-top:8px;
}

@media(max-width:768px){
    .header h1{
        font-size:32px;
    }

    .header p{
        font-size:17px;
    }

    .card{
        margin:25px 15px;
        padding:25px 15px;
    }

    .button{
        width:90%;
        font-size:18px;
        padding:17px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>♟️ WATER KIDS</h1>
    <p>Góc luyện cờ vua cho các con</p>
</div>

<div class="card">

    <a class="button green" href="baitap.html">
        🎯 LUYỆN BÀI TẬP CỜ VUA
    </a>
    <div class="note">
        Làm câu hỏi, chọn đáp án đúng, ghi điểm.
    </div>

    <a class="button blue" href="chess.html">
        🤖 LUYỆN CHƠI CỜ VUA VỚI MÁY
    </a>
    <div class="note">
        Chơi cờ với máy theo cấp độ: Dễ, Trung bình, Khó.
    </div>

    <a class="button purple" href="chess.html">
        ♟️ XEM BÀN CỜ
    </a>
    <div class="note">
        Mở bàn cờ để quan sát, luyện nhìn vị trí quân.
    </div>

</div>

<div class="footer">
    <p>Designed by Water</p>
</div>

</body>
</html>
