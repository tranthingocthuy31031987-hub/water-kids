<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Bàn cờ vua Water</title>
<style>
body{font-family:Arial;margin:0;background:#f5f5f5;text-align:center}
h1{background:#1976d2;color:white;padding:25px;margin:0}
.board{margin:35px auto;width:480px;height:480px;display:grid;grid-template-columns:repeat(8,1fr);border:3px solid #333}
.cell{display:flex;justify-content:center;align-items:center;font-size:40px}
.white{background:#f0d9b5}
.black{background:#b58863}
a{display:block;margin:25px;color:#1976d2;font-weight:bold;text-decoration:none}
</style>
</head>
<body>

<h1>♟️ BÀN CỜ VUA WATER</h1>

<div class="board" id="board"></div>

<a href="index.html">← Về trang chủ</a>

<script>
const pieces = [
["♜","♞","♝","♛","♚","♝","♞","♜"],
["♟","♟","♟","♟","♟","♟","♟","♟"],
["","","","","","","",""],
["","","","","","","",""],
["","","","","","","",""],
["","","","","","","",""],
["♙","♙","♙","♙","♙","♙","♙","♙"],
["♖","♘","♗","♕","♔","♗","♘","♖"]
];

const board = document.getElementById("board");

for(let r=0;r<8;r++){
  for(let c=0;c<8;c++){
    const cell=document.createElement("div");
    cell.className="cell " + ((r+c)%2==0 ? "white":"black");
    cell.innerHTML=pieces[r][c];
    board.appendChild(cell);
  }
}
</script>

</body>
</html>
