<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Cờ vua Water - Chơi với máy</title>

<link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
    text-align:center;
}

.header{
    background:#1976d2;
    color:white;
    padding:25px;
}

.header h1{
    margin:0;
    font-size:42px;
}

.container{
    max-width:1000px;
    margin:30px auto;
    background:white;
    padding:30px;
    border-radius:18px;
    box-shadow:0 0 18px rgba(0,0,0,0.15);
}

#board{
    width:620px;
    margin:25px auto;
}

.controls{
    margin-bottom:20px;
}

button, select{
    padding:12px 18px;
    margin:8px;
    border-radius:8px;
    border:none;
    font-size:16px;
}

button{
    background:#43a047;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#2e7d32;
}

select{
    border:1px solid #ccc;
}

#status{
    font-size:22px;
    font-weight:bold;
    color:#d32f2f;
    margin-top:20px;
}

.back{
    display:inline-block;
    margin-top:20px;
    text-decoration:none;
    color:#1976d2;
    font-weight:bold;
}

@media(max-width:700px){
    #board{
        width:92vw;
    }

    .header h1{
        font-size:30px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>♟️ CỜ VUA WATER</h1>
    <p>Chơi cờ vua với máy theo cấp độ</p>
</div>

<div class="container">

    <div class="controls">
        <b>Chọn cấp độ:</b>

        <select id="level">
            <option value="easy">Dễ</option>
            <option value="medium">Trung bình</option>
            <option value="hard">Khó</option>
        </select>

        <button onclick="newGame()">VÁN MỚI</button>
        <button onclick="flipBoard()">ĐỔI CHIỀU BÀN CỜ</button>
    </div>

    <div id="board"></div>

    <div id="status">Lượt của bạn: quân trắng</div>

    <p>
        Bạn cầm quân trắng. Kéo quân để đi. Máy sẽ tự đánh quân đen.
    </p>

    <a class="back" href="index.html">← Về trang chủ</a>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

<script>
let board = null;
let game = new Chess();
let currentOrientation = "white";

function onDragStart(source, piece) {
    if (game.game_over()) return false;

    // Người chơi chỉ cầm quân trắng
    if (piece.search(/^b/) !== -1) return false;

    // Chỉ được kéo khi tới lượt trắng
    if (game.turn() !== "w") return false;
}

function onDrop(source, target) {
    let move = game.move({
        from: source,
        to: target,
        promotion: "q"
    });

    if (move === null) {
        return "snapback";
    }

    updateStatus();

    setTimeout(makeComputerMove, 600);
}

function onSnapEnd() {
    board.position(game.fen());
}

function makeComputerMove() {
    if (game.game_over()) {
        updateStatus();
        return;
    }

    if (game.turn() !== "b") return;

    let level = document.getElementById("level").value;
    let move = null;

    if (level === "easy") {
        move = getRandomMove();
    }

    if (level === "medium") {
        move = getCaptureMove() || getRandomMove();
    }

    if (level === "hard") {
        move = getBestSimpleMove() || getCaptureMove() || getRandomMove();
    }

    if (move) {
        game.move(move);
        board.position(game.fen());
    }

    updateStatus();
}

function getRandomMove() {
    let moves = game.moves();
    if (moves.length === 0) return null;
    return moves[Math.floor(Math.random() * moves.length)];
}

function getCaptureMove() {
    let moves = game.moves({ verbose: true });
    let captures = moves.filter(m => m.captured);

    if (captures.length > 0) {
        return captures[Math.floor(Math.random() * captures.length)];
    }

    return null;
}

function getBestSimpleMove() {
    let moves = game.moves({ verbose: true });
    let bestMove = null;
    let bestValue = -99999;

    for (let i = 0; i < moves.length; i++) {
        let move = moves[i];

        game.move(move);
        let value = -evaluateBoard();
        game.undo();

        if (value > bestValue) {
            bestValue = value;
            bestMove = move;
        }
    }

    return bestMove;
}

function evaluateBoard() {
    let boardArray = game.board();
    let value = 0;

    const values = {
        p: 10,
        n: 30,
        b: 30,
        r: 50,
        q: 90,
        k: 900
    };

    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            let piece = boardArray[r][c];

            if (piece) {
                let pieceValue = values[piece.type];

                if (piece.color === "w") {
                    value += pieceValue;
                } else {
                    value -= pieceValue;
                }
            }
        }
    }

    return value;
}

function updateStatus() {
    let status = "";

    if (game.in_checkmate()) {
        if (game.turn() === "w") {
            status = "♛ Chiếu hết! Máy thắng.";
        } else {
            status = "🎉 Chiếu hết! Bạn thắng.";
        }
    } else if (game.in_draw()) {
        status = "🤝 Ván cờ hòa.";
    } else {
        if (game.turn() === "w") {
            status = "Lượt của bạn: quân trắng";
        } else {
            status = "Máy đang suy nghĩ...";
        }

        if (game.in_check()) {
            status += " - Đang bị chiếu!";
        }
    }

    document.getElementById("status").innerText = status;
}

function newGame() {
    game = new Chess();
    board.start();
    board.orientation(currentOrientation);
    updateStatus();
}

function flipBoard() {
    currentOrientation = currentOrientation === "white" ? "black" : "white";
    board.orientation(currentOrientation);
}

board = Chessboard("board", {
    draggable: true,
    position: "start",
    orientation: "white",
    pieceTheme: "https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png",
    onDragStart: onDragStart,
    onDrop: onDrop,
    onSnapEnd: onSnapEnd
});

updateStatus();
</script>

</body>
</html>
