<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Cờ vua Water</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
text-align:center;
margin:0;
}

h1{
background:#1976d2;
color:white;
padding:20px;
margin:0;
}

.board{
margin:30px auto;
width:480px;
height:480px;
display:grid;
grid-template-columns:repeat(8,1fr);
border:3px solid #333;
}

.white{
background:#f0d9b5;
}

.black{
background:#b58863;
}

.cell{
display:flex;
justify-content:center;
align-items:center;
font-size:40px;
}

</style>
</head>

<body>

<h1>♟️ CỜ VUA WATER</h1>

<div class="board" id="board"></div>

<script>

const pieces = [
["♜","♞","♝","♛","♚","♝","♞","♜"],
["♟","♟","♟","♟","♟","♟","♟","♟"],
["","","","","","","",""],
["","","","","","","",""],
["","","","","","","",""],
["","","","","","","",""],
["♙","♙","♙","♙","♙","♙","♙","♙"],
["♖","♘","♗","♕","♔","♗","♘","♖"]
];

const board = document.getElementById("board");

for(let r=0;r<8;r++){

for(let c=0;c<8;c++){

const cell=document.createElement("div");

cell.className=
"cell "+
((r+c)%2==0 ? "white":"black");

cell.innerHTML=pieces[r][c];

board.appendChild(cell);

}

}

</script>

</body>
</html>
