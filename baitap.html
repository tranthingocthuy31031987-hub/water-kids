<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Luyện bài tập cờ vua</title>
<style>
body{font-family:Arial;margin:0;background:#f4f6f9;text-align:center}
.header{background:#d32f2f;color:white;padding:25px}
.box{background:white;max-width:700px;margin:35px auto;padding:30px;border-radius:16px;box-shadow:0 0 15px #ccc}
button{display:block;width:80%;margin:15px auto;padding:16px;border:none;border-radius:10px;background:#1976d2;color:white;font-size:18px;font-weight:bold;cursor:pointer}
button:hover{background:#1565c0}
#result{font-size:22px;font-weight:bold;margin-top:25px}
.back{display:block;margin-top:25px;color:#1976d2;text-decoration:none;font-weight:bold}
.score{font-size:20px;color:#d32f2f;font-weight:bold}
</style>
</head>
<body>

<div class="header">
<h1>🎯 LUYỆN CỜ VUA</h1>
<p>Chọn đáp án đúng để ghi điểm</p>
</div>

<div class="box">

<h2 id="questionTitle">Bài 1</h2>
<p id="questionText">Trắng đi trước. Hãy tìm nước chiếu hết trong 1 nước.</p>

<p class="score">Điểm: <span id="score">0</span></p>

<button onclick="checkAnswer('A')">A. Hậu h5#</button>
<button onclick="checkAnswer('B')">B. Xe a8</button>
<button onclick="checkAnswer('C')">C. Mã f7</button>

<p id="result"></p>

<button onclick="nextQuestion()">CÂU TIẾP THEO</button>

<a class="back" href="index.html">← Về trang chủ</a>

</div>

<script>
let score = 0;
let current = 0;

const questions = [
  {
    title:"Bài 1",
    text:"Trắng đi trước. Hãy tìm nước chiếu hết trong 1 nước.",
    answers:["A. Hậu h5#","B. Xe a8","C. Mã f7"],
    correct:"A"
  },
  {
    title:"Bài 2",
    text:"Quân Mã đi theo hình gì?",
    answers:["A. Đi thẳng","B. Đi chéo","C. Đi hình chữ L"],
    correct:"C"
  },
  {
    title:"Bài 3",
    text:"Quân Xe đi như thế nào?",
    answers:["A. Ngang và dọc","B. Chéo","C. Hình chữ L"],
    correct:"A"
  }
];

function loadQuestion(){
  document.getElementById("questionTitle").innerText = questions[current].title;
  document.getElementById("questionText").innerText = questions[current].text;
  const buttons = document.querySelectorAll("button");
  buttons[0].innerText = questions[current].answers[0];
  buttons[1].innerText = questions[current].answers[1];
  buttons[2].innerText = questions[current].answers[2];
  document.getElementById("result").innerText = "";
}

function checkAnswer(answer){
  if(answer === questions[current].correct){
    score += 10;
    document.getElementById("score").innerText = score;
    document.getElementById("result").innerText = "✅ Chính xác! +10 điểm";
    document.getElementById("result").style.color = "green";
  }else{
    document.getElementById("result").innerText = "❌ Chưa đúng, thử lại nhé!";
    document.getElementById("result").style.color = "red";
  }
}

function nextQuestion(){
  current++;
  if(current >= questions.length){
    document.getElementById("result").innerText = "🎉 Hoàn thành! Tổng điểm: " + score;
    current = 0;
  }
  loadQuestion();
}

loadQuestion();
</script>

</body>
</html>
