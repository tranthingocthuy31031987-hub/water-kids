<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Luyện bài tập cờ vua</title>

<style>
body{
    font-family:Arial, sans-serif;
    margin:0;
    background:#f4f6f9;
    text-align:center;
    color:#222;
}

.header{
    background:#d32f2f;
    color:white;
    padding:35px 20px;
}

.header h1{
    margin:0;
    font-size:40px;
}

.box{
    background:white;
    max-width:820px;
    margin:35px auto;
    padding:35px;
    border-radius:18px;
    box-shadow:0 8px 25px rgba(0,0,0,0.12);
}

.question{
    font-size:20px;
    line-height:1.6;
    margin:20px 0;
}

.score{
    font-size:22px;
    color:#d32f2f;
    font-weight:bold;
}

.progress{
    color:#0d47a1;
    font-weight:bold;
    font-size:18px;
}

.answer{
    display:block;
    width:85%;
    margin:16px auto;
    padding:17px;
    border:none;
    border-radius:12px;
    background:#1976d2;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.answer:hover{
    background:#0d47a1;
}

.next{
    background:#43a047;
}

.next:hover{
    background:#2e7d32;
}

.restart{
    background:#fb8c00;
}

.restart:hover{
    background:#ef6c00;
}

#result{
    font-size:22px;
    font-weight:bold;
    min-height:45px;
    margin-top:22px;
    line-height:1.5;
}

.back{
    display:inline-block;
    margin-top:25px;
    color:white;
    background:#5e35b1;
    padding:14px 24px;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
}

.small{
    color:#666;
    font-size:15px;
    line-height:1.6;
}

@media(max-width:700px){
    .box{
        margin:25px 14px;
        padding:25px 12px;
    }

    .answer{
        width:92%;
        font-size:16px;
    }

    .header h1{
        font-size:30px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>🎯 LUYỆN BÀI TẬP CỜ VUA</h1>
    <p>Mỗi lượt luyện gồm 10 câu bất kỳ trong kho 100 câu</p>
</div>

<div class="box">

    <p class="progress" id="progress">Câu 1/10</p>

    <h2 id="questionTitle">Bài tập</h2>

    <p class="question" id="questionText"></p>

    <p class="score">
        Điểm lượt này: <span id="sessionScore">0</span>
    </p>

    <button class="answer" id="btnA" onclick="checkAnswer('A')"></button>
    <button class="answer" id="btnB" onclick="checkAnswer('B')"></button>
    <button class="answer" id="btnC" onclick="checkAnswer('C')"></button>

    <p id="result"></p>

    <button class="answer next" onclick="nextQuestion()">
        CÂU TIẾP THEO
    </button>

    <button class="answer restart" onclick="startNewSession()">
        LUYỆN LẠI 10 CÂU MỚI
    </button>

    <p class="small">
        Trả lời đúng được +10 điểm. Điểm sẽ tự lưu vào trang Thành tích của bé.
    </p>

    <a class="back" href="index.html">← Về trang chủ</a>

</div>

function getNumber(key){
    return Number(localStorage.getItem(key) || 0);
}

function setNumber(key, value){
    localStorage.setItem(key, String(value));
}

function addStat(key, amount){
    setNumber(key, getNumber(key) + amount);
}

function shuffleArray(arr){
    let copy = [...arr];

    for(let i = copy.length - 1; i > 0; i--){
        let j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
    }

    return copy;
}

function startNewSession(){
    sessionScore = 0;
    current = 0;
    answered = false;

    selectedQuestions = shuffleArray(questionBank).slice(0, 10);

    document.getElementById("sessionScore").innerText = sessionScore;

    loadQuestion();
}

function loadQuestion(){
    answered = false;

    const q = selectedQuestions[current];

    document.getElementById("progress").innerText = "Câu " + (current + 1) + "/10";
    document.getElementById("questionTitle").innerText = "Bài " + (current + 1);
    document.getElementById("questionText").innerText = q.q;

    document.getElementById("btnA").innerText = q.a.A;
    document.getElementById("btnB").innerText = q.a.B;
    document.getElementById("btnC").innerText = q.a.C;

    document.getElementById("result").innerText = "";
}

function checkAnswer(answer){
    if(answered){
        document.getElementById("result").innerText = "Con đã trả lời câu này rồi. Bấm CÂU TIẾP THEO nhé.";
        document.getElementById("result").style.color = "#555";
        return;
    }

    answered = true;
    addStat("chess_questions", 1);

    const q = selectedQuestions[current];

    if(answer === q.c){
        sessionScore += 10;

        addStat("chess_score", 10);
        addStat("chess_correct", 1);

        document.getElementById("sessionScore").innerText = sessionScore;

        document.getElementById("result").innerHTML =
            "✅ Chính xác! +10 điểm<br><span style='font-size:16px;color:#555'>" + q.l + "</span>";

        document.getElementById("result").style.color = "green";
    }else{
        document.getElementById("result").innerHTML =
            "❌ Chưa đúng. Đáp án đúng là: " + q.c +
            "<br><span style='font-size:16px;color:#555'>" + q.l + "</span>";

        document.getElementById("result").style.color = "red";
    }
}

function nextQuestion(){
    if(!answered){
        document.getElementById("result").innerText = "Con hãy chọn một đáp án trước nhé.";
        document.getElementById("result").style.color = "#d32f2f";
        return;
    }

    current++;

    if(current >= selectedQuestions.length){
        alert("🎉 Hoàn thành 10 câu! Điểm lượt này: " + sessionScore + "/100");
        startNewSession();
        return;
    }

    loadQuestion();
}

startNewSession();
