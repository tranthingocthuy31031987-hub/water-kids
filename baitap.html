<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Luyện bài tập cờ vua</title>

<style>
body{
    font-family:Arial, sans-serif;
    margin:0;
    background:#f4f6f9;
    text-align:center;
    color:#222;
}

.header{
    background:#d32f2f;
    color:white;
    padding:35px 20px;
}

.header h1{
    margin:0;
    font-size:40px;
}

.box{
    background:white;
    max-width:760px;
    margin:35px auto;
    padding:35px;
    border-radius:18px;
    box-shadow:0 8px 25px rgba(0,0,0,0.12);
}

.question{
    font-size:20px;
    line-height:1.6;
    margin:20px 0;
}

.score{
    font-size:22px;
    color:#d32f2f;
    font-weight:bold;
}

.answer{
    display:block;
    width:85%;
    margin:16px auto;
    padding:17px;
    border:none;
    border-radius:12px;
    background:#1976d2;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.answer:hover{
    background:#0d47a1;
}

.next{
    background:#43a047;
}

.next:hover{
    background:#2e7d32;
}

#result{
    font-size:22px;
    font-weight:bold;
    min-height:35px;
    margin-top:22px;
}

.back{
    display:inline-block;
    margin-top:25px;
    color:white;
    background:#5e35b1;
    padding:14px 24px;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
}

.small{
    color:#666;
    font-size:15px;
}

@media(max-width:700px){
    .box{
        margin:25px 14px;
        padding:25px 12px;
    }

    .answer{
        width:92%;
        font-size:16px;
    }

    .header h1{
        font-size:30px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>🎯 LUYỆN BÀI TẬP CỜ VUA</h1>
    <p>Chọn đáp án đúng để ghi điểm</p>
</div>

<div class="box">

    <h2 id="questionTitle">Bài 1</h2>

    <p class="question" id="questionText">
        Trắng đi trước. Hãy tìm nước chiếu hết trong 1 nước.
    </p>

    <p class="score">
        Điểm phiên này: <span id="sessionScore">0</span>
    </p>

    <button class="answer" id="btnA" onclick="checkAnswer('A')"></button>
    <button class="answer" id="btnB" onclick="checkAnswer('B')"></button>
    <button class="answer" id="btnC" onclick="checkAnswer('C')"></button>

    <p id="result"></p>

    <button class="answer next" onclick="nextQuestion()">
        CÂU TIẾP THEO
    </button>

    <p class="small">
        Trả lời đúng được +10 điểm. Điểm sẽ tự lưu vào trang Thành tích.
    </p>

    <a class="back" href="index.html">← Về trang chủ</a>

</div>

<script>
let sessionScore = 0;
let current = 0;
let answered = false;

const questions = [
    {
        title:"Bài 1",
        text:"Trắng đi trước. Hãy tìm nước chiếu hết trong 1 nước.",
        answers:{
            A:"A. Hậu h5#",
            B:"B. Xe a8",
            C:"C. Mã f7"
        },
        correct:"A",
        lesson:"Chiếu hết là mục tiêu quan trọng hơn ăn quân."
    },
    {
        title:"Bài 2",
        text:"Quân Mã đi theo hình gì?",
        answers:{
            A:"A. Đi thẳng",
            B:"B. Đi chéo",
            C:"C. Đi hình chữ L"
        },
        correct:"C",
        lesson:"Quân Mã đặc biệt vì có thể nhảy qua quân khác."
    },
    {
        title:"Bài 3",
        text:"Quân Xe đi như thế nào?",
        answers:{
            A:"A. Đi ngang và dọc",
            B:"B. Đi chéo",
            C:"C. Đi hình chữ L"
        },
        correct:"A",
        lesson:"Xe rất mạnh ở hàng ngang và cột dọc mở."
    },
    {
        title:"Bài 4",
        text:"Trong khai cuộc, việc nào thường nên làm sớm?",
        answers:{
            A:"A. Đưa Hậu ra thật sớm",
            B:"B. Phát triển Mã, Tượng và nhập thành",
            C:"C. Đi một quân nhiều lần"
        },
        correct:"B",
        lesson:"Khai cuộc tốt là phát triển quân và bảo vệ Vua."
    },
    {
        title:"Bài 5",
        text:"Trước khi đi một nước, con nên tự hỏi điều gì?",
        answers:{
            A:"A. Quân mình có đang bị ăn không?",
            B:"B. Đi nước nào cho nhanh nhất?",
            C:"C. Có nên bỏ Vua không?"
        },
        correct:"A",
        lesson:"Luôn kiểm tra quân mình có bị đối phương tấn công không."
    }
];

function getNumber(key){
    return Number(localStorage.getItem(key) || 0);
}

function setNumber(key, value){
    localStorage.setItem(key, String(value));
}

function addStat(key, amount){
    setNumber(key, getNumber(key) + amount);
}

function loadQuestion(){
    answered = false;

    const q = questions[current];

    document.getElementById("questionTitle").innerText = q.title;
    document.getElementById("questionText").innerText = q.text;

    document.getElementById("btnA").innerText = q.answers.A;
    document.getElementById("btnB").innerText = q.answers.B;
    document.getElementById("btnC").innerText = q.answers.C;

    document.getElementById("result").innerText = "";
}

function checkAnswer(answer){
    if(answered){
        document.getElementById("result").innerText = "Con đã trả lời câu này rồi. Bấm CÂU TIẾP THEO nhé.";
        document.getElementById("result").style.color = "#555";
        return;
    }

    answered = true;
    addStat("chess_questions", 1);

    const q = questions[current];

    if(answer === q.correct){
        sessionScore += 10;

        addStat("chess_score", 10);
        addStat("chess_correct", 1);

        document.getElementById("sessionScore").innerText = sessionScore;
        document.getElementById("result").innerHTML =
            "✅ Chính xác! +10 điểm<br><span style='font-size:16px;color:#555'>" + q.lesson + "</span>";

        document.getElementById("result").style.color = "green";
    }else{
        document.getElementById("result").innerHTML =
            "❌ Chưa đúng. Đáp án đúng là: " + q.correct +
            "<br><span style='font-size:16px;color:#555'>" + q.lesson + "</span>";

        document.getElementById("result").style.color = "red";
    }
}

function nextQuestion(){
    current++;

    if(current >= questions.length){
        current = 0;
        alert("🎉 Con đã hoàn thành một vòng bài tập! Điểm phiên này: " + sessionScore);
    }

    loadQuestion();
}

loadQuestion();
</script>

</body>
</html>
